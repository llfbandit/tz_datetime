# Run with `dart run ffigen --config ffi/ffigen_windows.yaml`.

name: IcuBindings
description: Bindings for ICU (Windows)

language: c
output:
  bindings: '../lib/src/platform/windows/icu_bindings.dart'

exclude-all-by-default: true

functions:
  include:
    - ucal_open
    - ucal_close
    - ucal_setMillis
    - ucal_get
    - ucal_getTimeZoneID
    - ucal_openTimeZones
    - uenum_unext
    - uenum_close
  # ICU never calls back into Dart, so skip the full VM transition.
  leaf:
    include:
      - '.*'

structs:
  include:
    - UCalendar
    - UEnumeration

typedefs:
  include:
    - UChar
    - UDate
    - UBool
    - UErrorCode

headers:
  entry-points:
    - 'icu_minimal.h'
